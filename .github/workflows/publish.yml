name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Check publishable packages have build output
        run: node scripts/check-publishable-dist.js

      # The bundle is built from the publishable-workspace list, not from directory
      # globs: private workspaces stay out of the release artifact entirely, and a
      # new publishable workspace under any root is picked up with no change here.
      # Tarring also keeps every path repo-root-relative, so the publish job can
      # extract it in place without inferring an artifact root.
      - name: Bundle dist output
        run: node scripts/check-publishable-dist.js --list | tar -czf dist-bundle.tar.gz -T -

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    environment: production-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.5

      - run: npm ci --ignore-scripts

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Unpack dist output
        run: |
          tar -xzf dist-bundle.tar.gz
          rm dist-bundle.tar.gz

      # Last gate before `changeset publish`: a workspace missing from the artifact
      # would otherwise publish as a tarball with no code in it.
      - name: Check publishable packages have build output
        run: node scripts/check-publishable-dist.js

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: npm run version-packages
          publish-script: npm run publish
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          NPM_CONFIG_PROVENANCE: true

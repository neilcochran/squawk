name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # While changesets are pending there is nothing to publish: version.yml owns
  # turning them into the "Version Packages" PR. The release only proceeds on a
  # commit where that PR has been merged and the changesets are consumed.
  pending:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.changesets.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: .changeset

      - name: Detect pending changesets
        id: changesets
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::notice::Pending changesets found; skipping the release."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: pending
    if: ${{ needs.pending.outputs.changesets == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Check publishable packages have build output
        run: node scripts/check-publishable-dist.js

      # The bundle is built from the publishable-workspace list, not from directory
      # globs: private workspaces stay out of the release artifact entirely, and a
      # new publishable workspace under any root is picked up with no change here.
      # Tarring also keeps every path repo-root-relative, so the publish job can
      # extract it in place without inferring an artifact root.
      - name: Bundle dist output
        run: node scripts/check-publishable-dist.js --list | tar -czf dist-bundle.tar.gz -T -

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    environment: production-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.12

      - run: npm ci --ignore-scripts

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      - name: Unpack dist output
        run: |
          tar -xzf dist-bundle.tar.gz
          rm dist-bundle.tar.gz

      # Last gate before `changeset publish`: a workspace missing from the artifact
      # would otherwise publish as a tarball with no code in it.
      - name: Check publishable packages have build output
        run: node scripts/check-publishable-dist.js

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run publish
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          NPM_CONFIG_PROVENANCE: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run knip

      - run: npm run format:check

      - run: npm run build

      # The test:coverage script uses --concurrency=50% to avoid
      # oversubscription with vitest's internal worker pool.
      - run: npm run test:coverage

      - run: npm run lint:pack

      - run: npm run api:check

      - name: Check README data dates
        run: node scripts/check-readme-dates.js

      - name: Check MCP pinned-version snippet
        run: node scripts/check-mcp-pin.js

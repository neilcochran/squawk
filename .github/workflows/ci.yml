name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run knip

      - run: npm run format:check

      - run: npm run build

      # The test:coverage script uses --concurrency=50% to avoid
      # oversubscription with vitest's internal worker pool.
      - run: npm run test:coverage

      - run: npm run lint:pack

      - run: npm run api:check

      - name: Check README data dates
        run: node scripts/check-readme-dates.js

      - name: Check MCP pinned-version snippet
        run: node scripts/check-mcp-pin.js
